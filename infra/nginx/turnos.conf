# Turnos HTTP bootstrap — ACME challenge + redirect once TLS is ready.
# Installed to ${NGINX_CONF_DIR}/turnos.conf

upstream turnos_app {
  server turnos_app:3000;
}

server {
  listen 80;
  listen [::]:80;
  server_name turnos.andiko.cloud;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}
