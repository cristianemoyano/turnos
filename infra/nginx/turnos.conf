# Turnos HTTP bootstrap — ACME challenge + redirect once TLS is ready.
# Installed to ${NGINX_CONF_DIR}/turnos.conf
# No upstream here: turnos_app may not exist yet; SSL conf adds it after deploy.

server {
  listen 80;
  listen [::]:80;
  server_name turnos.andiko.cloud;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}
